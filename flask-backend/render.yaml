services:
  # Flask Backend Service
  - type: web
    name: flask-leadflow-backend
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: gunicorn run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: leadflow-db
          property: connectionString

# MySQL Free Database on Render/Railway
databases:
  - name: leadflow-db
    databaseName: leadflow_db
    user: leadflow_user
    plan: free
